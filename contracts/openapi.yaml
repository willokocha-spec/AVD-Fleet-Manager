openapi: 3.1.0
info:
  title: AVD Fleet API
  version: 0.1.0
  description: 'REST API for the AVD Fleet daemon. All /api/v1 routes require a bearer token

    unless `auth_required` is disabled. The token is stored in the data directory

    with owner-only permissions. WebSocket clients pass the token as `?token=`

    and must send an allowed Origin.


    Secrets are never returned: proxy passwords are always masked, and error

    bodies are redacted. Destructive operations accept `dry_run` where documented.

    '
servers:
- url: http://127.0.0.1:8765
  description: Default loopback daemon
security:
- bearerAuth: []
tags:
- name: system
- name: images
- name: oobe
- name: templates
- name: instances
- name: proxies
- name: scripts
- name: appium
- name: fleet
- name: portable
- name: events
paths:
  /health:
    get:
      tags:
      - system
      operationId: getHealth
      security: []
      summary: Liveness probe (unauthenticated)
      responses:
        '200':
          description: Daemon is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/check:
    get:
      tags:
      - system
      operationId: checkAuth
      summary: Validate the bearer token
      responses:
        '200':
          description: Token accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/system:
    get:
      tags:
      - system
      operationId: getSystem
      summary: Host and runtime information
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/config:
    get:
      tags:
      - system
      operationId: getConfig
      summary: Effective configuration (no secrets)
      responses:
        '200':
          description: Configuration view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigView'
    patch:
      tags:
      - system
      operationId: updateConfig
      summary: Update a whitelisted subset of settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigPatch'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigView'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/doctor:
    get:
      tags:
      - system
      operationId: runDoctor
      summary: Run environment doctor checks
      parameters:
      - name: slow
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Doctor report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorReport'
  /api/v1/doctor/fix:
    post:
      tags:
      - system
      operationId: fixDoctorCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - check_id
              properties:
                check_id:
                  type: string
      responses:
        '200':
          description: Fix outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/capacity:
    get:
      tags:
      - instances
      operationId: getCapacity
      summary: Fleet capacity (RAM, ports, CPU)
      responses:
        '200':
          description: Capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityInfo'
  /api/v1/images:
    get:
      tags:
      - images
      operationId: listImages
      parameters:
      - name: include_remote
        in: query
        schema:
          type: boolean
          default: true
      - name: installed_only
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: System images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemImage'
    post:
      tags:
      - images
      operationId: importImage
      summary: Import a custom system image from a host directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageImportRequest'
      responses:
        '201':
          description: Imported image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemImage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/images/refresh:
    post:
      tags:
      - images
      operationId: refreshImages
      responses:
        '200':
          description: Refreshed image catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemImage'
  /api/v1/images/{image_id}:
    get:
      tags:
      - images
      operationId: getImage
      parameters:
      - $ref: '#/components/parameters/ImageId'
      responses:
        '200':
          description: Image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemImage'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/images/{image_id}/download:
    post:
      tags:
      - images
      operationId: downloadImage
      parameters:
      - $ref: '#/components/parameters/ImageId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Installed image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemImage'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/oobe/matrix:
    get:
      tags:
      - oobe
      operationId: getOobeMatrix
      responses:
        '200':
          description: OOBE matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OobeMatrix'
  /api/v1/oobe/verify:
    post:
      tags:
      - oobe
      operationId: verifyOobeImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - image_id
              properties:
                image_id:
                  type: string
                timeout_s:
                  type: integer
                  minimum: 30
                  maximum: 1800
                keep_avd:
                  type: boolean
                  default: false
      responses:
        '200':
          description: OOBE record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OobeRecord'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/oobe/records/{image_id}:
    get:
      tags:
      - oobe
      operationId: getOobeRecord
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OOBE record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OobeRecord'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/templates:
    get:
      tags:
      - templates
      operationId: listTemplates
      responses:
        '200':
          description: AVD templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
    post:
      tags:
      - templates
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
      responses:
        '201':
          description: Created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/templates/{template_id}:
    get:
      tags:
      - templates
      operationId: getTemplate
      parameters:
      - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - templates
      operationId: updateTemplate
      parameters:
      - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
    delete:
      tags:
      - templates
      operationId: deleteTemplate
      parameters:
      - $ref: '#/components/parameters/TemplateId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices:
    get:
      tags:
      - templates
      operationId: listDeviceProfiles
      responses:
        '200':
          description: Device profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceProfile'
  /api/v1/instances:
    get:
      tags:
      - instances
      operationId: listInstances
      responses:
        '200':
          description: Instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvdInfo'
    post:
      tags:
      - instances
      operationId: createInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceCreateRequest'
      responses:
        '201':
          description: Created instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvdInfo'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/instances/bulk:
    post:
      tags:
      - instances
      operationId: bulkDeployInstances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeployRequest'
      responses:
        '201':
          description: Created instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvdInfo'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/instances/{name}:
    get:
      tags:
      - instances
      operationId: getInstance
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      responses:
        '200':
          description: Instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvdInfo'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - instances
      operationId: deleteInstance
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      - name: delete_files
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/instances/{name}/start:
    post:
      tags:
      - instances
      operationId: startInstance
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proxy_id:
                  type:
                  - string
                  - 'null'
                headless:
                  type:
                  - boolean
                  - 'null'
                dry_run:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Started instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvdInfo'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/instances/{name}/stop:
    post:
      tags:
      - instances
      operationId: stopInstance
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                timeout_s:
                  type:
                  - number
                  - 'null'
      responses:
        '200':
          description: Stopped instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvdInfo'
  /api/v1/instances/{name}/restart:
    post:
      tags:
      - instances
      operationId: restartInstance
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      responses:
        '200':
          description: Restarted instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvdInfo'
  /api/v1/instances/{name}/wait-boot:
    post:
      tags:
      - instances
      operationId: waitBoot
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout_s:
                  type:
                  - integer
                  - 'null'
      responses:
        '200':
          description: Booted instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvdInfo'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/instances/{name}/reset-oobe:
    post:
      tags:
      - instances
      - oobe
      operationId: resetInstanceOobe
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                strategy:
                  type: string
                  enum:
                  - snapshot
                  - wipe
                  - package
                  - reboot
                verify:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Reset result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OobeResetResult'
  /api/v1/instances/{name}/screenshot:
    get:
      tags:
      - instances
      - screen
      operationId: getScreenshot
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      responses:
        '200':
          description: PNG screenshot
          content:
            image/png:
              schema:
                type: string
                format: binary
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/instances/{name}/config:
    put:
      tags:
      - instances
      operationId: updateInstanceConfig
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - values
              properties:
                values:
                  type: object
                  additionalProperties:
                    type: string
                dry_run:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Updated instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvdInfo'
  /api/v1/instances/{name}/clone:
    post:
      tags:
      - instances
      operationId: cloneInstance
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Cloned instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvdInfo'
  /api/v1/instances/{name}/snapshots:
    get:
      tags:
      - instances
      operationId: listSnapshots
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      responses:
        '200':
          description: Snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Snapshot'
    post:
      tags:
      - instances
      operationId: createSnapshot
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                golden:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
  /api/v1/instances/{name}/snapshots/{snapshot}/load:
    post:
      tags:
      - instances
      operationId: loadSnapshot
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      - name: snapshot
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Snapshot restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
  /api/v1/instances/{name}/snapshots/{snapshot}:
    delete:
      tags:
      - instances
      operationId: deleteSnapshot
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      - name: snapshot
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
  /api/v1/instances/{name}/input:
    post:
      tags:
      - instances
      - screen
      operationId: sendInput
      parameters:
      - $ref: '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputRequest'
      responses:
        '200':
          description: Input delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
  /api/v1/proxies:
    get:
      tags:
      - proxies
      operationId: listProxies
      parameters:
      - name: include_disabled
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Proxies (passwords masked)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProxyView'
    post:
      tags:
      - proxies
      operationId: createProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyCreateRequest'
      responses:
        '201':
          description: Created proxy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyView'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/proxies/import:
    post:
      tags:
      - proxies
      operationId: importProxies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  description: One proxy URL per line
                source:
                  type: string
                  default: paste
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyImportResult'
  /api/v1/proxies/check-all:
    post:
      tags:
      - proxies
      operationId: checkAllProxies
      responses:
        '200':
          description: Check results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProxyTestResult'
  /api/v1/proxies/{proxy_id}:
    get:
      tags:
      - proxies
      operationId: getProxy
      parameters:
      - $ref: '#/components/parameters/ProxyId'
      responses:
        '200':
          description: Proxy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyView'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - proxies
      operationId: updateProxy
      parameters:
      - $ref: '#/components/parameters/ProxyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated proxy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyView'
    delete:
      tags:
      - proxies
      operationId: deleteProxy
      parameters:
      - $ref: '#/components/parameters/ProxyId'
      responses:
        '204':
          description: Deleted
  /api/v1/proxies/{proxy_id}/check:
    post:
      tags:
      - proxies
      operationId: checkProxy
      parameters:
      - $ref: '#/components/parameters/ProxyId'
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyTestResult'
  /api/v1/proxies/verify-guest:
    post:
      tags:
      - proxies
      operationId: verifyGuestEgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - avd_name
              - proxy_id
              properties:
                avd_name:
                  type: string
                proxy_id:
                  type: string
                token_url:
                  type:
                  - string
                  - 'null'
                timeout_s:
                  type:
                  - number
                  - 'null'
      responses:
        '200':
          description: Guest egress result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyTestResult'
  /api/v1/assignments:
    get:
      tags:
      - proxies
      operationId: listAssignments
      responses:
        '200':
          description: Proxy assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProxyAssignment'
    post:
      tags:
      - proxies
      operationId: assignProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - avd_name
              - proxy_id
              properties:
                avd_name:
                  type: string
                proxy_id:
                  type: string
      responses:
        '200':
          description: Assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyAssignment'
  /api/v1/assignments/{avd_name}:
    delete:
      tags:
      - proxies
      operationId: unassignProxy
      parameters:
      - name: avd_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Unassigned
  /api/v1/assignments/auto:
    post:
      tags:
      - proxies
      operationId: autoAssignProxies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - instances
              properties:
                instances:
                  type: array
                  items:
                    type: string
                strategy:
                  type: string
                  enum:
                  - round_robin
                  - random
                  - healthiest
                  default: round_robin
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProxyAssignment'
  /api/v1/bridges:
    get:
      tags:
      - proxies
      operationId: listBridges
      responses:
        '200':
          description: Active local bridges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BridgeConfig'
  /api/v1/scripts:
    get:
      tags:
      - scripts
      operationId: listScripts
      responses:
        '200':
          description: Scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScriptDefinition'
    post:
      tags:
      - scripts
      operationId: createScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptDefinition'
      responses:
        '201':
          description: Created script
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptDefinition'
