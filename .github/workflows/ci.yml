name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Lint, types and the pure-Python test suite on all three desktop OSes.
  # These jobs need no Android tooling: tests use the executable fakes.
  # ---------------------------------------------------------------------------
  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests bootstrap

      - name: Mypy
        run: mypy

      - name: Pytest (no real-emulator tests)
        run: python -m pytest -m "not emulator" -q

      - name: Bootstrap static tests
        run: python -m pytest bootstrap/test_bootstrap.py -q

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: |
            .pytest_cache
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # React GUI: typecheck, lint, unit tests (Vitest + MSW), production build.
  # ---------------------------------------------------------------------------
  ui:
    name: UI (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ui
        run: pnpm typecheck

      - name: Lint
        working-directory: ui
        run: pnpm lint

      - name: Unit tests
        working-directory: ui
        run: pnpm test

      - name: Production build
        working-directory: ui
        run: pnpm build

      - name: Upload built UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Documentation sanity: every relative Markdown link must resolve to a real
  # file in this repository. Pure Python stdlib, no dependencies.
  # ---------------------------------------------------------------------------
  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check relative Markdown links
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          root = Path.cwd()
          md_files = [root / "README.md", *sorted((root / "docs").glob("*.md"))]
          md_files += [p for p in sorted((root / "bootstrap").glob("*.md"))]
          md_files += [p for p in sorted(root.glob("*.md")) if p not in md_files]
          link = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          broken = []
          for path in md_files:
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              # ignore code fences so shell examples do not count as links
              text = re.sub(r"```.*?```", "", text, flags=re.S)
              for target in link.findall(text):
                  target = target.split("#", 1)[0].strip()
                  if not target or target.startswith(("http://", "https://", "mailto:", "#", "/")):
                      continue
                  target = target.strip("<>")
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      broken.append(f"{path.relative_to(root)} -> {target}")
          if broken:
              print("Broken relative links:")
              print("\n".join(sorted(broken)))
              sys.exit(1)
          print(f"All relative links resolve ({len(md_files)} files checked).")
          PY

  # ---------------------------------------------------------------------------
  # Installer engine in distro containers. BEST EFFORT: the image install
  # exercises only the static installer-provider paths; it never downloads the
  # Android SDK. It skips cleanly when Docker or the installer tests are absent.
  # ---------------------------------------------------------------------------
  installer-containers:
    name: Installer (${{ matrix.distro }}, best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:12
            prepare: "apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv git"
          - distro: ubuntu
            image: ubuntu:24.04
            prepare: "apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv git"
          - distro: fedora
            image: fedora:41
            prepare: "dnf install -y -q python3 python3-pip git"
          - distro: rocky
            image: rockylinux:9
            prepare: "dnf install -y -q python3 python3-pip git"
          - distro: arch
            image: archlinux:latest
            prepare: "pacman -Sy --noconfirm python python-pip git"
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker availability
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker is unavailable on this runner; skipping installer container job (best effort)."
          fi

      - name: Check installer tests exist
        id: tests
        run: |
          if compgen -G "tests/installer/test_*.py" >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No tests/installer tests in this checkout; skipping (best effort)."
          fi

      - name: Run installer tests in ${{ matrix.image }}
        if: steps.docker.outputs.available == 'true' && steps.tests.outputs.present == 'true'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            ${{ matrix.image }} \
            sh -ec "${{ matrix.prepare }} && python3 -m pip install --break-system-packages -e '.[dev]' && python3 -m pytest tests/installer -q"

  # ---------------------------------------------------------------------------
  # BEST EFFORT ONLY. GitHub-hosted runners do not support nested virtualisation
  # in a supported way; KVM on the Ubuntu runner is experimental and frequently
  # unavailable. This job must never gate a merge or a release: it is marked
  # continue-on-error and only produces optional evidence. A green result is not
  # a release criterion; a red/skipped result is expected.
  # ---------------------------------------------------------------------------
  kvm-e2e:
    name: KVM E2E (best effort, nested virt unsupported)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # GitHub's own documentation calls nested virtualisation unsupported.
      # This rule mirrors the community workaround and may still fail.
      - name: Try to expose /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Real-emulator tests (best effort)
        run: python -m pytest -m emulator -q || true

      - name: Acceptance self-test (best effort)
        run: avdfleet selftest --e2e --require-acceleration --json || true
