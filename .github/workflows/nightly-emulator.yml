name: Nightly emulator (best effort)

# BEST EFFORT ONLY: GitHub-hosted runners do not support nested virtualisation
# in a supported way. KVM may or may not be exposed; this workflow is expected
# to fail or skip and must never be cited as real-emulator evidence. A release
# must not depend on this workflow.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-emulator
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  emulator:
    name: Real AVD self-test (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Try to expose /dev/kvm (experimental; nested virt unsupported)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Full acceptance self-test against real tooling
        run: avdfleet selftest --e2e --require-acceleration --count 2 --json | tee selftest-emulator.json || true

      - name: Emulator-marked pytest tests
        run: python -m pytest -m emulator -q || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-emulator-evidence
          path: |
            selftest-emulator.json
            .pytest_cache
          if-no-files-found: ignore
          retention-days: 14
