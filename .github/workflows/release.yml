name: Release

# Builds the wheel/sdist plus the daemon UI and attaches them to a GitHub
# release when a v* tag is pushed. The wheel force-includes src/avdfleet/api/static
# (pyproject.toml), so the UI must be built before packaging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build artifacts for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the web GUI into the package static directory
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build:daemon

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify the wheel bundles the GUI
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("no wheel was built")
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          required = ["avdfleet/api/static/index.html"]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit(f"wheel is missing bundled UI files: {missing}")
          print(f"{wheels[0]}: bundled UI OK ({len(names)} entries)")
          PY

      - name: Write checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "AVD Fleet $TAG" \
              --generate-notes
          fi

      - name: Release checklist reminder
        run: |
          echo "Remember to attach the acceptance evidence summary from docs/acceptance.md;"
          echo "release notes must state which acceptance items were real-emulator and which were fakes."
