[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "avdfleet"
version = "0.1.0"
description = "Install, isolate and automate fleets of Android Virtual Devices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "AVD Fleet" }]
keywords = ["android", "emulator", "avd", "appium", "automation", "proxy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.9,<3",
  "fastapi>=0.115,<2",
  "uvicorn>=0.30,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<16",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "cryptography>=43,<52",
  "psutil>=6,<8",
  "platformdirs>=4,<5",
  "websockets>=12,<18",
  "python-multipart>=0.0.9,<1",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<8",
  "pytest-timeout>=2.3,<3",
  "respx>=0.21,<1",
  "ruff>=0.6",
  "mypy>=1.10",
]
playwright = ["playwright>=1.44"]

[project.scripts]
avdfleet = "avdfleet.cli.main:main"

[project.urls]
Homepage = "https://example.invalid/avdfleet"
Documentation = "https://example.invalid/avdfleet/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/avdfleet"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/contracts",
  "/bootstrap",
  "/ui",
  "/README.md",
  "/LICENSE",
  "/PUBLISHING.md",
  "/BRIEF.md",
  "/BRIEF_ORIGINAL.md",
  "/DECISIONS.md",
  "/PLAN.md",
  "/FINAL_REPORT.md",
  "/docs",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = "-q --strict-markers"
markers = [
  "emulator: requires a real hardware-accelerated Android emulator",
  "integration: integration test against fakes",
  "contract: OpenAPI/JSON-schema contract test",
  "portable: portable-edition test",
  "ui: UI/e2e test",
  "slow: slow test",
]
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  "ignore::DeprecationWarning:httpx.*",
]

[tool.coverage.run]
source = ["src/avdfleet"]
omit = ["*/api/static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011"]

[tool.mypy]
python_version = "3.12"
files = ["src/avdfleet"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["src/avdfleet/api/static"]
